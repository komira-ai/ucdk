[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/komira-ai/ucdk"
# The toolchain pinned in rust-toolchain.toml.
rust-version = "1.95"
version = "0.0.0"
publish = false

[workspace.dependencies]
# The protobuf runtime: the Message trait the generated catalog types implement.
prost = "0.14"
# Generates the Rust types from the .proto files at build time.
prost-build = "0.14"
# The well-known protobuf types (Duration) the generated code refers to.
prost-types = "0.14"
# A protobuf compiler in pure Rust, so no protoc binary is needed to build or test.
protox = "0.10"
# Parses the pull-request event file the platform provides to CI.
serde_json = "1"
# Verifies the SHA-256 pin of each downloaded tool, and computes the node-key and field digests.
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A named subset of clippy::pedantic, not the whole group.
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
