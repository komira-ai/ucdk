[package]
name = "ucdk-proto"
description = "The ucdk.resource.v1 catalog as Rust types, generated at build time."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The generated types hold no I/O, no clock and no HashMap (maps are ordered), and the pure
# planning crates depend on them: see ucdk-provider for what the mark requires.
[package.metadata.ucdk]
pure = true

[dependencies]
prost.workspace = true
prost-types.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
protox.workspace = true

[lints]
workspace = true
