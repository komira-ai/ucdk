# The purity template. A pure crate holds no I/O, no wall clock and no HashMap, so its results
# depend only on its inputs and its iteration order is defined. `cargo xtask check` requires
# every entry below in each crate marked pure. A crate-level clippy.toml replaces the
# workspace one, so the test allowances are repeated here.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not defined; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order is not defined; use BTreeSet" },
    { path = "std::time::SystemTime", reason = "no wall clock in a pure crate" },
    { path = "std::time::Instant", reason = "no clock in a pure crate" },
    { path = "std::fs::File", reason = "no I/O in a pure crate" },
    { path = "std::net::TcpStream", reason = "no I/O in a pure crate" },
]

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "no wall clock in a pure crate" },
    { path = "std::time::Instant::now", reason = "no clock in a pure crate" },
    { path = "std::fs::read", reason = "no I/O in a pure crate" },
    { path = "std::fs::read_to_string", reason = "no I/O in a pure crate" },
    { path = "std::fs::write", reason = "no I/O in a pure crate" },
    { path = "std::fs::read_dir", reason = "no I/O in a pure crate" },
    { path = "std::net::TcpStream::connect", reason = "no I/O in a pure crate" },
    { path = "std::process::Command::new", reason = "no processes in a pure crate" },
    { path = "std::env::var", reason = "no environment in a pure crate" },
    { path = "std::thread::sleep", reason = "no clock in a pure crate" },
]

disallowed-macros = [
    { path = "std::println", reason = "no I/O in a pure crate" },
    { path = "std::eprintln", reason = "no I/O in a pure crate" },
    { path = "std::print", reason = "no I/O in a pure crate" },
    { path = "std::eprint", reason = "no I/O in a pure crate" },
]
