[package]
name = "ucdk-release-fake"
description = "Working in-memory implementations of the release seams, with fault injection and call logs: the executable specification each real implementation is held to."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Marks a crate that holds no I/O, no wall clock and no HashMap: `cargo xtask check` requires
# the deny-list clippy.toml next to its manifest.
[package.metadata.ucdk]
pure = true

[dependencies]
sha2.workspace = true
ucdk-core = { path = "../ucdk-core" }
ucdk-release = { path = "../ucdk-release" }
ucdk-release-proto = { path = "../ucdk-release-proto" }
ucdk-release-seams = { path = "../ucdk-release-seams" }

[lints]
workspace = true
