[package]
name = "ucdk-plan"
description = "The catalog (validate and lower a resource list to nodes), dependency order, and the plan against an observed state."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# See ucdk-provider: pure crates carry the deny-list clippy.toml.
[package.metadata.ucdk]
pure = true

[dependencies]
prost.workspace = true
prost-reflect.workspace = true
sha2.workspace = true
ucdk-proto = { path = "../ucdk-proto" }
ucdk-provider = { path = "../ucdk-provider" }

[lints]
workspace = true

[dev-dependencies]
# The Duration type of the generated request-timeout fields.
prost-types.workspace = true
# Compiles the test protos that declare resource types the catalog has never seen.
protox.workspace = true
