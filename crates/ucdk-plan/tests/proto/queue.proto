// A resource type the catalog has never heard of, declared in a test proto and nowhere else.
// There is no Rust for it: no lowering code, no match arm, no generated type. The planner reads
// this file's descriptors and the options on them, and that is the whole cost of the type on the
// planning side (a provider that hosts the kind is the other half).
syntax = "proto3";

package example.queue.v1;

import "google/protobuf/duration.proto";
import "ucdk/resource/v1/resource.proto";

message Queue {
  option (ucdk.resource.v1.portability) = PORTABLE;
  option (ucdk.resource.v1.exposes) = HOST;

  string topic = 1;
  uint32 visibility_seconds = 2 [(ucdk.resource.v1.fallback) = "30"];
  repeated string tags = 3 [(ucdk.resource.v1.node_name) = "tag"];
  ucdk.resource.v1.Size size = 4
      [(ucdk.resource.v1.render) = "{cpu_millis}m/{memory_mb}MB",
       (ucdk.resource.v1.fallback) = "250m/128MB"];
  google.protobuf.Duration retention = 5
      [(ucdk.resource.v1.render) = "{seconds}s", (ucdk.resource.v1.fallback) = "345600s"];
  map<string, ucdk.resource.v1.Value> settings = 6;
  map<string, ucdk.resource.v1.SecretRef> secret_settings = 7;
  string dead_letter = 8 [(ucdk.resource.v1.fallback) = "none"];

  oneof ordering {
    Fifo fifo = 10 [(ucdk.resource.v1.role) = "fifo"];
    Unordered unordered = 11 [(ucdk.resource.v1.unlowered) = true];
  }

  message Fifo {
    string group = 1;
    int64 dedup_window_seconds = 2;
  }
  message Unordered {}
}

// The list a deploy step writes, with the new type beside the service. A catalog is the
// resource list message it is read from.
message Resource {
  string id = 1;
  repeated ucdk.resource.v1.Uses uses = 2;
  oneof body {
    ucdk.resource.v1.Service service = 10;
    Queue queue = 12;
  }
}

message ResourceList {
  repeated Resource resource = 1;
}
