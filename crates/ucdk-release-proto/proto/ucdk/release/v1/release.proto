// SPDX-License-Identifier: Apache-2.0
// The ucdk release messages (`ucdk.release.v1`): the declaration of a release machine, what a
// build produces, the facts a driver supplies and the results a run reports.
//
// The messages are data. A result is never parsed for its text: `message` and `detail` fields are
// for a person, and the closed `Reason` set is what a program reads. Numbers are a promise; a
// field is added, never renumbered, and a number that is retired is `reserved`. Every enum has a
// zero value named `*_UNSPECIFIED`, which a reader refuses.
//
// Names (stage, step, validation, channel) match `[a-z][a-z0-9-]*`, at most 63 bytes, with no
// trailing `-`. Artifact names also allow `_`.

syntax = "proto3";

package ucdk.release.v1;

// ---- declaration (authored; the SDKs build these) ----

message Machine {
  // 1. A newer major is a distinct refusal.
  int32 schema_version = 1;
  string name = 2;
  repeated Stage stages = 3;
  // Declaration order is part of the contract.
  repeated ArtifactDecl artifacts = 4;
  repeated Channel channels = 5;
  // Path globs whose commits never raise the build number.
  repeated string stamp_ignore = 6;
}

message Stage {
  // Also the unit of trust and of driver job.
  string name = 1;
  // Earlier-declared stages: a graph ordered by dependency, each of which must be confirmed
  // for the run before this stage's first effect.
  repeated string needs = 2;
  Trigger trigger = 3;
  // The trust scope the driver gives this stage; the stage name when empty.
  string environment = 4;
  // May run off the mainline, with a reason.
  bool exceptional = 5;
  // Run in this order, stopping at the first one that is not SUCCEEDED or NOOP. A stage with a
  // PUBLISH step has no BUILD step, and every step of a stage names one platform, the stage's.
  repeated Step steps = 6;
}

// CHANGE_CHECK stages hold BUILD steps only.
enum Trigger {
  TRIGGER_UNSPECIFIED = 0;
  RELEASE = 1;
  CHANGE_CHECK = 2;
}

message Step {
  // Unique in the stage.
  string name = 1;
  oneof action {
    Build build = 2;
    Publish publish = 3;
  }
  // Any step kind may carry them.
  repeated Validation validations = 4;
}

message Build {
  string platform = 1;
  repeated string artifacts = 2;
}

message Publish {
  string platform = 1;
  repeated string artifacts = 2;
  string channel = 3;
  // Puts per coordinate that a transient or rate-limited answer may use; 0 reads as the default
  // of 3; at most 10.
  uint32 attempts = 4;
  // Read-back polls per coordinate; 0 reads as the default of 3; at most 10.
  uint32 polls = 5;
}

// The platform is "<os>-<cpu>" or "any", never a cloud or a registry. It is the stage's platform.
// The two bounds are authored in the machine, so the machine hash covers them.

message Validation {
  // Unique in the stage.
  string name = 1;
  // A registered validator kind.
  string validator = 2;
  // What it reads.
  Subject subject = 3;
  // Authored up front: the denominator of the verdict.
  repeated ExpectedRow rows = 4;
  // For CHANNEL_READBACK, bounded polls for absence; 0 means none; at most 10.
  uint32 wait_polls = 5;
  // Read only by the validator kind.
  map<string, string> options = 6;
}

enum Subject {
  SUBJECT_UNSPECIFIED = 0;
  LOCAL_SET = 1;
  CHANNEL_READBACK = 2;
}

message ExpectedRow {
  string name = 1;
  // One sentence of what the row proves.
  string asserts = 2;
}

message ArtifactDecl {
  reserved 5;
  // Byte-equal to its manifest name.
  string name = 1;
  ArtifactType type = 2;
  // Executable (a bare name or an absolute path) and arguments; argv only.
  Command builder = 3;
  // Artifacts that must exist first; a group names its members.
  repeated string needs = 4;
  // Default false: the member's version equals the build stamp's version.
  bool independent_version = 6;
}

message Command {
  string executable = 1;
  repeated string args = 2;
}

enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  FILE = 1;
  OCI = 2;
  CONDA = 3;
  PYTHON = 4;
  NPM = 5;
}

message Channel {
  string name = 1;
  // At most one per artifact type.
  repeated Repository repositories = 2;
  // Never takes a build older than one it holds.
  bool monotonic = 3;
}

message Repository {
  ArtifactType type = 1;
  // Compared byte for byte; no two repositories share one.
  string location = 2;
  // Per repository, hence per artifact type.
  Visibility visibility = 3;
  // Required; never defaulted.
  PushIdentity push = 4;
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  PUBLIC = 1;
  PRIVATE = 2;
}

message PushIdentity {
  oneof kind {
    Anonymous anonymous = 1;
    Federated federated = 2;
  }
}

message Anonymous {}

message Federated {
  // The one identity the registry trusts to push.
  string subject = 1;
  string audience = 2;
  // Used by an exceptional run; must differ from `subject`.
  string exceptional_subject = 3;
  // The environment `subject` names; a stage that publishes here has this environment.
  string environment = 4;
  // The environment `exceptional_subject` names; set exactly when `exceptional_subject` is.
  string exceptional_environment = 5;
}

// ---- produced (by a build; read by publish and validate) ----

message Manifest {
  int32 schema_version = 1;
  ArtifactType type = 2;
  string name = 3;
  // Equals the build stamp's version unless the declaration says independent_version.
  string version = 4;
  // The release's platform, or "any".
  string platform = 5;
  // A bare name inside the store entry: a file, or an OCI layout directory.
  string file = 6;
  // The identity digest, 64 lowercase hex. What it digests depends on the type: the file's
  // bytes for FILE, the image manifest digest of the layout for OCI.
  string sha256 = 7;
  // FILE: the file's length. OCI: the sum of the lengths of the blobs the image manifest
  // reaches. Recomputed when a member is verified.
  uint64 size = 8;
  // Which build made it, so a registry can be asked and a monotonic channel decided.
  Stamped stamp = 9;
  // Typed per ecosystem.
  oneof metadata {
    FileMeta file_meta = 10;
    OciMeta oci = 11;
  }
}

// The build stamp without its version and timestamp.
message Stamped {
  uint64 build_number = 1;
  string source_commit = 2;
}

message FileMeta {
  map<string, string> labels = 1;
}

// The image manifest digest is the `sha256` field of the manifest.
message OciMeta {
  reserved 3;
  string os = 1;
  string cpu = 2;
}

// A member carries no store key: its key is derived from the scope of the set and its name on
// every read, so a document cannot point a reader at another generation or scope.
message Member {
  Manifest manifest = 1;
}

// The set document: stored once per sealed set.
message ReleaseSet {
  int32 schema_version = 1;
  // The full commit id.
  string revision = 2;
  string platform = 3;
  // Sorted by name.
  repeated Member members = 4;
  // Written with the set and recomputed on every read; a differing value is refused.
  string set_hash = 5;
  // Hashed: the stage and environment that built the set.
  Producer producer = 6;
  // Never hashed: which run and attempt.
  ProducedBy produced_by = 7;
}

// The BUILD stage's name and its environment (the name when none was set).
message Producer {
  string stage = 1;
  string environment = 2;
}

message ProducedBy {
  string run_id = 1;
  uint32 attempt = 2;
}

// An input to a build; never typed, never read from the environment.
message BuildStamp {
  string version = 1;
  uint64 build_number = 2;
  string source_commit = 3;
  uint64 timestamp_ms = 4;
}

message Coordinate {
  string channel = 1;
  ArtifactType type = 2;
  string name = 3;
  string version = 4;
  string platform = 5;
}

// What a registry reports for a coordinate it holds.
message Held {
  string digest = 1;
  Stamped stamp = 2;
  bool exceptional = 3;
}

// ---- facts supplied by the driver ----

message RunIdentity {
  // [a-z0-9_-]{1,63}; never minted here.
  string run_id = 1;
  // At least 1, required, no default.
  uint32 attempt = 2;
  // At most 32 pairs, recorded verbatim, gating nothing.
  map<string, string> context = 3;
}

message SourceFacts {
  string revision = 1;
  // UNKNOWN is never a pass.
  Tri on_mainline = 2;
  Tri is_tip = 3;
  // 1 to 200 bytes, one line, for an exceptional run.
  string reason = 4;
}

enum Tri {
  TRI_UNSPECIFIED = 0;
  YES = 1;
  NO = 2;
  UNKNOWN = 3;
}

// ---- results ----

enum Verdict {
  // 10 was CANCELLED: nothing can produce it while callbacks into the host are out of scope.
  reserved 10;
  VERDICT_UNSPECIFIED = 0;
  // The exit class "done".
  SUCCEEDED = 1;
  NOOP = 2;
  SUPERSEDED = 3;
  REFUSED = 4;
  FAILED = 5;
  INDETERMINATE = 6;
  PARTIAL = 7;
  INTERRUPTED = 8;
  VALIDATION_FAILED = 9;
}

// Stable: the message text is for humans and never parsed.
enum Reason {
  REASON_UNSPECIFIED = 0;
  MACHINE_FORMAT = 1;
  MACHINE_VERSION = 2;
  STAGE_UNKNOWN = 3;
  SELECTOR = 4;
  SELECTOR_NO_MATCH = 5;
  SET_MEMBER = 6;
  SET_HASH = 7;
  CHANNEL = 8;
  CREDENTIAL = 9;
  APPROVED_NAMES = 10;
  PUBLISH_DIFFERENT_BYTES = 11;
  PUBLISH_YANKED = 12;
  PUBLISH_READ_BACK = 13;
  PUBLISH_UPLOAD = 14;
  NOT_ON_MAINLINE = 15;
  EXCEPTIONAL_REASON = 16;
  SUPERSEDED_BY_NEWER = 17;
  INPUTS_CHANGED = 18;
  VALIDATION = 19;
  CANNOT_TELL = 20;
  LEASE_HELD = 21;
  LEASE_LOST = 22;
  LEDGER = 23;
  BUILD_FAILED = 24;
  ROW_ACCOUNTING = 25;
  PIN_MISMATCH = 26;
  SOURCE = 27;
  STAGE_NOT_ADMITTED = 28;
  RUN_HASH_MISMATCH = 29;
  LEASE_UNCONFIRMED = 30;
  MEMBER_VERSION = 31;
  PLATFORM_MISMATCH = 32;
}

enum RowState {
  ROW_UNSPECIFIED = 0;
  ROW_PASSED = 1;
  ROW_FAILED = 2;
  ROW_NOT_RUN = 3;
  ROW_NOT_REACHED = 4;
  ROW_UNREADABLE = 5;
}

message Row {
  string name = 1;
  RowState state = 2;
  string detail = 3;
}

message ValidationReport {
  string name = 1;
  Verdict verdict = 2;
  repeated Row rows = 3;
  repeated string leftovers = 4;
  string validation_run_id = 5;
}

message StepReport {
  string name = 1;
  Verdict verdict = 2;
  Reason reason = 3;
  string message = 4;
  repeated Effect effects = 5;
  repeated ValidationReport validations = 6;
  // Artifact names the channel has never held.
  repeated string new_names = 7;
}

message Effect {
  string what = 1;
  string subject = 2;
  EffectState state = 3;
}

enum EffectState {
  EFFECT_UNSPECIFIED = 0;
  BUILT = 1;
  PUBLISHED = 2;
  ALREADY_PRESENT = 3;
  WOULD_BUILD = 4;
  WOULD_PUBLISH = 5;
  NOT_REACHED = 6;
  YANKED = 7;
}
