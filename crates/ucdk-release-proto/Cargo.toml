[package]
name = "ucdk-release-proto"
description = "The ucdk.release.v1 messages: a release machine, what a build produces, and what a run reports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Marks a crate that holds no I/O, no wall clock and no HashMap: `cargo xtask check` requires
# the deny-list clippy.toml next to its manifest.
[package.metadata.ucdk]
pure = true

[dependencies]
prost.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
prost-reflect.workspace = true
protox.workspace = true

[lints]
workspace = true
