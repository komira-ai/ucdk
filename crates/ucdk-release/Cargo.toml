[package]
name = "ucdk-release"
description = "The release model: a checked machine, the text rules of its flags and environment, the selection of what a run does, the release hashes, the set document, store keys, the verification of a stored member, the layering of a build-system invocation, the parse of its listing and test report, manifest composition, the set closure, the accounting of rows, the decisions to publish and to stand down for a newer build, and the record codec with its state-transition table."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Marks a crate that holds no I/O, no wall clock and no HashMap: `cargo xtask check` requires
# the deny-list clippy.toml next to its manifest.
[package.metadata.ucdk]
pure = true

[dependencies]
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
ucdk-core = { path = "../ucdk-core" }
ucdk-release-proto = { path = "../ucdk-release-proto" }

[lints]
workspace = true
