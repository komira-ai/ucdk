[package]
name = "ucdk-release"
description = "The release model: a checked machine, the hashes that approve it, the decisions to publish or stand down, the record codec and the checks of a stored set."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Marks a crate that holds no I/O, no wall clock and no HashMap: `cargo xtask check` requires
# the deny-list clippy.toml next to its manifest.
[package.metadata.ucdk]
pure = true

[dependencies]
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
ucdk-core = { path = "../ucdk-core" }
ucdk-release-proto = { path = "../ucdk-release-proto" }

[lints]
workspace = true
