# Template for every pure crate: copy to <crate>/clippy.toml unchanged.
# This is a deny-list, not a proof of purity: a reviewer still reads every pure crate.
# Time, randomness and I/O enter a pure crate as inputs or trait objects.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "pure crates take this as an input" },
    { path = "std::time::SystemTime::elapsed", reason = "pure crates take this as an input" },
    { path = "std::time::Instant::now", reason = "pure crates take this as an input" },
    { path = "std::time::Instant::elapsed", reason = "pure crates take this as an input" },
    { path = "std::thread::sleep", reason = "pure crates take this as an input" },
    { path = "std::env::var", reason = "pure crates take this as an input" },
    { path = "std::env::var_os", reason = "pure crates take this as an input" },
    { path = "std::env::vars", reason = "pure crates take this as an input" },
    { path = "std::env::vars_os", reason = "pure crates take this as an input" },
    { path = "std::env::args", reason = "pure crates take this as an input" },
    { path = "std::env::args_os", reason = "pure crates take this as an input" },
    { path = "std::env::current_dir", reason = "pure crates take this as an input" },
    { path = "std::env::current_exe", reason = "pure crates take this as an input" },
    { path = "std::env::temp_dir", reason = "pure crates take this as an input" },
    { path = "std::env::set_var", reason = "pure crates take this as an input" },
    { path = "std::env::remove_var", reason = "pure crates take this as an input" },
    { path = "std::process::exit", reason = "pure crates take this as an input" },
    { path = "std::process::abort", reason = "pure crates take this as an input" },
    { path = "std::process::id", reason = "pure crates take this as an input" },
    { path = "std::process::Command::new", reason = "pure crates take this as an input" },
    { path = "std::fs::canonicalize", reason = "pure crates take this as an input" },
    { path = "std::fs::copy", reason = "pure crates take this as an input" },
    { path = "std::fs::create_dir", reason = "pure crates take this as an input" },
    { path = "std::fs::create_dir_all", reason = "pure crates take this as an input" },
    { path = "std::fs::exists", reason = "pure crates take this as an input" },
    { path = "std::fs::hard_link", reason = "pure crates take this as an input" },
    { path = "std::fs::metadata", reason = "pure crates take this as an input" },
    { path = "std::fs::read", reason = "pure crates take this as an input" },
    { path = "std::fs::read_dir", reason = "pure crates take this as an input" },
    { path = "std::fs::read_link", reason = "pure crates take this as an input" },
    { path = "std::fs::read_to_string", reason = "pure crates take this as an input" },
    { path = "std::fs::remove_dir", reason = "pure crates take this as an input" },
    { path = "std::fs::remove_dir_all", reason = "pure crates take this as an input" },
    { path = "std::fs::remove_file", reason = "pure crates take this as an input" },
    { path = "std::fs::rename", reason = "pure crates take this as an input" },
    { path = "std::fs::set_permissions", reason = "pure crates take this as an input" },
    { path = "std::fs::symlink_metadata", reason = "pure crates take this as an input" },
    { path = "std::fs::write", reason = "pure crates take this as an input" },
    { path = "std::fs::File::open", reason = "pure crates take this as an input" },
    { path = "std::fs::File::create", reason = "pure crates take this as an input" },
    { path = "std::fs::File::create_new", reason = "pure crates take this as an input" },
    { path = "std::fs::File::options", reason = "pure crates take this as an input" },
    { path = "std::fs::OpenOptions::new", reason = "pure crates take this as an input" },
    { path = "std::path::Path::exists", reason = "pure crates take this as an input" },
    { path = "std::path::Path::try_exists", reason = "pure crates take this as an input" },
    { path = "std::path::Path::metadata", reason = "pure crates take this as an input" },
    { path = "std::path::Path::symlink_metadata", reason = "pure crates take this as an input" },
    { path = "std::path::Path::canonicalize", reason = "pure crates take this as an input" },
    { path = "std::path::Path::read_dir", reason = "pure crates take this as an input" },
    { path = "std::path::Path::read_link", reason = "pure crates take this as an input" },
    { path = "std::path::Path::is_file", reason = "pure crates take this as an input" },
    { path = "std::path::Path::is_dir", reason = "pure crates take this as an input" },
    { path = "std::net::TcpStream::connect", reason = "pure crates take this as an input" },
    { path = "std::net::TcpListener::bind", reason = "pure crates take this as an input" },
    { path = "std::net::UdpSocket::bind", reason = "pure crates take this as an input" },
